[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notebooklm-mcp"
version = "0.1.0"
description = "Dual-mode MCP server for NotebookLM (web + Enterprise REST API)"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "aiofiles>=24.0",
    # enterprise auth
    "google-auth>=2.0",
    "google-auth-httplib2>=0.2",
]

[project.scripts]
notebooklm-mcp = "notebooklm_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/notebooklm_mcp"]
